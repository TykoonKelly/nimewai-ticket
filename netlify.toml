# netlify.toml
[build]
  command = "npm run build"
  publish = "dist"

# Redirect all routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Admin routes redirect
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# API redirects (if you have a backend API)
[[redirects]]
  from = "/api/*"
  to = "https://your-backend-api.com/api/:splat"
  status = 200
  force = true

# Handle 404 errors
[[redirects]]
  from = "/404.html"
  to = "/index.html"
  status = 404

# Cache control for static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"